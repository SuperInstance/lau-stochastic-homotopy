[package]
name = "lau-stochastic-homotopy"
version = "0.1.0"
edition = "2021"
description = "Stochastic processes meet homotopy theory — continuous deformation of agent policies"
license = "MIT"
repository = "https://github.com/SuperInstance/lau-stochastic-homotopy"
keywords = ["homotopy", "stochastic", "policy", "topology", "agent"]
categories = ["mathematics", "science"]

[dependencies]
nalgebra = { version = "0.33", features = ["serde-serialize"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
rand_distr = "0.4"
thiserror = "2"

[dev-dependencies]
approx = "0.5"
